<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Atika Software</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .error-page { min-height: 100vh; background: var(--navy); display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }
    .error-code { font-family: var(--font-head); font-size: clamp(80px, 15vw, 140px); font-weight: 800; color: rgba(37,99,235,0.2); line-height: 1; margin-bottom: 16px; }
    .error-title { font-size: clamp(24px, 4vw, 36px); font-weight: 800; color: white; margin-bottom: 12px; }
    .error-desc { font-size: 17px; color: rgba(255,255,255,0.55); margin-bottom: 36px; max-width: 420px; line-height: 1.6; }
    .error-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Página no encontrada</h1>
      <p class="error-desc">La página que buscás no existe o fue movida. Revisá la URL o volvé al inicio.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">← Volver al inicio</a>
        <a href="contacto.html" class="btn btn-ghost">Contactar</a>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
